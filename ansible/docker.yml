---
- name: Install Docker on all target hosts
  hosts: all
  become: yes

  tasks:
    - name: Gather OS family info
      ansible.builtin.setup:
        filter: ansible_os_family

    # ---------------- Debian/Ubuntu ----------------
    - name: Install required packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Add Docker GPG key (Debian/Ubuntu)
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Add Docker repository (Debian/Ubuntu)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install Docker (Debian/Ubuntu)
      ansible.builtin.apt:
        name: docker-ce
        state: latest
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    # ---------------- RHEL/CentOS ----------------
    - name: Install required packages (RHEL/CentOS)
      ansible.builtin.yum:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Add Docker repo (RHEL/CentOS)
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Repository
        baseurl: https://download.docker.com/linux/centos/docker-ce.repo
        gpgcheck: yes
        enabled: yes
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install Docker (RHEL/CentOS)
      ansible.builtin.yum:
        name: docker-ce
        state: latest
      when: ansible_facts['os_family'] == "RedHat"

    # ---------------- Common Steps ----------------
    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Add current user to docker group (optional)
      ansible.builtin.user:
        name: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
        groups: docker
        append: yes

